[platformio]
src_dir = firmware
; default_envs = led
default_envs = goForward

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps = arduino-libraries/Servo

[env:led]
build_src_filter = +<${this.__env__}/>

[env:goForward]
build_src_filter = +<${this.__env__}/>
