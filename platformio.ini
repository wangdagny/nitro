[platformio]
src_dir = firmware
; default_envs = testIrSensor
; default_envs = goStraight
; default_envs = followLinePid
; default_envs = followLinePattern
default_envs = goRound
; default_envs = followLineLiner
; default_envs = calibrateIrSensor

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = arduino-libraries/Servo
monitor_speed = 115200

[env:testIrSensor]
build_src_filter = +<${this.__env__}/>

[env:goStraight]
build_src_filter = +<${this.__env__}/>

[env:calibrateIrSensor]
build_src_filter = +<${this.__env__}/>

[env:followLinePid]
build_src_filter = +<${this.__env__}/>

[env:followLinePattern]
build_src_filter = +<${this.__env__}/>

[env:goRound]
build_src_filter = +<${this.__env__}/>

[env:followLineLiner]
build_src_filter = +<${this.__env__}/>
